name: Nightly release

on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC = 00:00 in Vietnam (UTC+7)
  workflow_dispatch:
    inputs:
      force:
        description: Release even if no pull request was merged in the last 24 hours
        type: boolean
        default: false

concurrency:
  group: nightly-release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Was a pull request merged today?
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.merged.outputs.release }}
    steps:
      - name: Count pull requests merged into main in the last 24 hours
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          since="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state merged \
            --search "merged:>=$since" --json number --jq length)"
          echo "Pull requests merged into main since $since: $count"
          if [ "$count" -gt 0 ] || [ "$FORCE" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # Worked out once, so both architecture builds use the same tag and the same commit.
  version:
    name: Work out the next version
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history and tags for next-version.sh

      - name: Next version
        id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if tag="$(./scripts/next-version.sh)"; then
            echo "Next version: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            # next-version.sh printed why: no commits, or only doc changes, since the last release.
            echo "Nothing to publish."
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.tag != ''
    # Each architecture is built and tested on a Mac of that type.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel # GitHub's Intel macOS runner
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0 # full history: ci-restore-mtimes.sh needs each file's last commit
          submodules: recursive

      # Same cache name as CI: this job runs on main, and pull requests can restore caches saved on
      # main. Its .build holds the same debug and release products as a CI run, so new pull requests
      # start with ImGui already compiled.
      - name: Set up Swift and the build cache
        uses: ./.github/actions/swift-setup
        with:
          cache-name: ci

      - name: Test
        run: swift test

      - name: Build and zip the release
        run: ./scripts/package-release.sh "${{ needs.version.outputs.tag }}" "${{ matrix.arch }}"

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: RenderLab-${{ matrix.arch }}
          path: dist/RenderLab-${{ needs.version.outputs.tag }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  # Runs only when both builds passed, so a release always has both zips.
  publish:
    name: Publish the GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Download the zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "renderLab $TAG" \
            --generate-notes \
            --notes "macOS 13 or newer. Download the zip for your Mac:
          - Apple Silicon (M1 and newer): \`RenderLab-$TAG-macos-arm64.zip\`
          - Intel: \`RenderLab-$TAG-macos-x86_64.zip\`

          Unzip, then run \`./RenderLab\` or \`./RenderLab --backend metal\` from the folder. Keep \`RenderLab_RenderLabCore.bundle\` next to the executable.
          The build isn't notarized: if macOS blocks it, run \`xattr -dr com.apple.quarantine <unzipped folder>\` once."
